{% extends 'workouts/base.html' %}

{% block title %}Новая тренировка — Workout Tracker{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Новая тренировка</h1>

        <p class="auth-subtitle">
            Добавьте информацию о тренировке
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="name">
                    Название
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Например: Ноги"
                    required
                >

            </div>


            <div class="form-group">

                <label for="date">
                    Дата
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <button type="submit" class="button">
                Создать тренировку
            </button>

        </form>

        <p class="auth-link">
            <a href="{% url 'workout_list' %}">
                ← Вернуться к тренировкам
            </a>
        </p>

    </div>

</div>

{% endblock %}
