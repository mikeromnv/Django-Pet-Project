{% extends 'workouts/base.html' %}

{% block title %}Новая тренировка — Workout Tracker{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="form-title">

            <div class="form-title-icon">
                <i data-lucide="dumbbell"></i>
            </div>

            <div>
                <h1>Новая тренировка</h1>

                <p class="auth-subtitle">
                    Добавьте информацию о тренировке
                </p>
            </div>

        </div>


        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="name">
                    Название
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Например: Ноги"
                    required
                >

            </div>


            <div class="form-group">

                <label for="date">
                    Дата
                </label>

                <div class="input-with-icon">

                    <i data-lucide="calendar"></i>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>

            </div>


            <button type="submit" class="button create-button">
                <i data-lucide="check"></i>
                Создать тренировку
            </button>

        </form>


        <p class="auth-link">

            <a href="{% url 'workout_list' %}">
                <i data-lucide="arrow-left"></i>
                Вернуться к тренировкам
            </a>

        </p>

    </div>

</div>

{% endblock %}
