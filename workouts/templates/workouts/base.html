<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Workout Tracker{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* ---------- HEADER ---------- */

        header {
            height: 70px;
            border-bottom: 1px solid #252525;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff6b00;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .nav a {
            color: #aaaaaa;
            transition: 0.2s;
        }

        .nav a:hover {
            color: #ffffff;
        }

        .nav .logout {
            color: #ff6b00;
        }

        /* ---------- MAIN ---------- */

        main {
            min-height: calc(100vh - 70px);
            padding: 40px;
        }

        /* ---------- AUTH ---------- */

        .auth-container {
            min-height: calc(100vh - 150px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #111111;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 35px;
        }

        .auth-card h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-subtitle {
            color: #888888;
            margin-bottom: 30px;
        }

        /* ---------- FORMS ---------- */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cccccc;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 7px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff6b00;
        }

        /* ---------- BUTTON ---------- */

        .button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #ff6b00;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .button:hover {
            background: #e55f00;
        }

        /* ---------- ERRORS ---------- */

        .error {
            background: #2a1111;
            border: 1px solid #6b2020;
            color: #ff8585;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        /* ---------- AUTH LINK ---------- */

        .auth-link {
            text-align: center;
            margin-top: 25px;
            color: #888888;
        }

        .auth-link a {
            color: #ff6b00;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        /* ---------- HOME ---------- */

        .home-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .welcome {
            margin-bottom: 40px;
        }

        .welcome h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #888888;
            font-size: 17px;
        }

        .accent {
            color: #ff6b00;
        }

        .card {
            background: #111111;
            border: 1px solid #252525;
            border-radius: 12px;
            padding: 25px;
        }


                /* ---------- PAGE HEADER ---------- */

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .page-subtitle {
            color: #888888;
        }

        .add-button {
            width: auto;
            padding: 12px 20px;
        }


        /* ---------- WORKOUT LIST ---------- */

        .workout-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .workout-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

        .workout-card:hover {
            border-color: #ff6b00;
        }

        .workout-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .workout-date {
            color: #777777;
        }

        .details-link {
            color: #ff6b00;
        }

        .details-link:hover {
            text-decoration: underline;
        }


        /* ---------- EMPTY STATE ---------- */

        .empty-state {
            text-align: center;
            padding: 60px 30px;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #777777;
            margin-bottom: 25px;
        }

        .empty-button {
            width: auto;
            display: inline-block;
            padding: 12px 25px;
        }

        /* ---------- ADD EXERCISE ---------- */

        .add-exercise-card {
            margin-bottom: 35px;
        }

        .add-exercise-card h2 {
            margin-bottom: 20px;
        }

        .exercise-form {
            display: flex;
            gap: 12px;
        }

        .exercise-form select {
            flex: 1;
            padding: 13px 14px;
            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 7px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .exercise-form select:focus {
            border-color: #ff6b00;
        }

        .exercise-form .button {
            width: auto;
            padding: 13px 25px;
        }


        /* ---------- WORKOUT CONTENT ---------- */

        .workout-content h2 {
            margin-bottom: 20px;
        }

        /* ---------- MUSCLE GROUPS ---------- */

        .muscle-groups {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 5px 2px 15px;
            margin-bottom: 20px;

            scrollbar-width: thin;
        }

        .muscle-groups::-webkit-scrollbar {
            height: 5px;
        }

        .muscle-bubble {
            flex-shrink: 0;

            padding: 10px 18px;

            background: #181818;
            color: #aaaaaa;

            border: 1px solid #333333;
            border-radius: 50px;

            font-size: 14px;
            cursor: pointer;

            transition: 0.2s;
        }

        .muscle-bubble:hover {
            border-color: #ff6b00;
            color: #ffffff;
        }

        .muscle-bubble.active {
            background: #ff6b00;
            border-color: #ff6b00;
            color: #ffffff;
        }

        .exercise-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .exercise-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 50px;
        }

        .exercise-bubble {
            padding: 10px 16px;
            background: #181818;
            color: #aaaaaa;
            border: 1px solid #333333;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }

        .exercise-bubble:hover {
            border-color: #ff6b00;
            color: #ffffff;
        }

        .exercise-bubble.active {
            background: #ff6b00;
            border-color: #ff6b00;
            color: #ffffff;
        }

        .exercise-form .button {
            align-self: flex-start;
            width: auto;
            min-width: 150px;
        }
        /* ---------- EXERCISE CARD ---------- */

        .workout-card {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            align-items: start;
        }

        .exercise-info {
            padding-top: 5px;
        }

        .exercise-info h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .sets-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sets-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .set-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .set-number {
            width: 25px;
            color: #777777;
            font-size: 14px;
            text-align: center;
        }

        .set-input {
            width: 140px;
            padding: 10px 12px;

            background: #0a0a0a;
            border: 1px solid #333333;
            border-radius: 7px;

            color: #ffffff;
            font-size: 14px;

            outline: none;
        }

        .set-input:focus {
            border-color: #ff6b00;
        }

        .set-input::placeholder {
            color: #666666;
        }

        .save-button {
            width: auto;
            align-self: flex-start;
            padding: 10px 25px;
        }
    </style>
</head>

<body>

<header>
    <a href="{% url 'home' %}" class="logo">
        WORKOUT<span>TRACKER</span>
    </a>

    {% if user.is_authenticated %}
        <nav class="nav">
            <a href="{% url 'home' %}">Главная</a>
            <a href="{% url 'workout_list' %}">Тренировки</a>
            <a href="{% url 'logout' %}" class="logout">Выйти</a>
        </nav>
    {% endif %}
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
