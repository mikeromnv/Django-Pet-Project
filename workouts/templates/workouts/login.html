{% extends 'workouts/base.html' %}

{% block title %}Вход — Workout Tracker{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>С возвращением</h1>

        <p class="auth-subtitle">
            Войдите в свой аккаунт
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Логин</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Введите логин"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Введите пароль"
                    required
                >
            </div>

            <button type="submit" class="button">
                Войти
            </button>
        </form>

        <p class="auth-link">
            Нет аккаунта?
            <a href="{% url 'register' %}">
                Зарегистрироваться
            </a>
        </p>

    </div>

</div>

{% endblock %}
